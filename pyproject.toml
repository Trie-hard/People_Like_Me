[project]
name = "people-like-me"
version = "0.1.0"
description = "NHANES-grounded dual-lens lab contextualization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pyarrow>=14.0.0",
    "pandera>=0.18.0",
    "pydantic>=2.5.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
